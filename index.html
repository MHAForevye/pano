<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantar Pano</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="view"><div id="world">
  <svg id="strings" width="4000" height="3000"></svg>
  <canvas id="draw" width="4000" height="3000"></canvas>
</div></div>

<div id="bar">
  <div class="grp" id="modes">
    <button data-m="select" class="on" title="Seç / taşı (V)">Seç</button>
    <button data-m="thread" title="İki karta sırayla tıkla (T)">İp</button>
    <button data-m="pen" title="Kalem (P)">✏️ Kalem</button>
    <button data-m="marker" title="Kalın işaretleyici (M)">🖍️ İşaretleyici</button>
    <button data-m="eraser" title="Silgi (E)">🧽 Silgi</button>
    <button data-m="stamp" title="Mühür (S): karta veya panoya tıkla">Mühür</button>
    <select id="stampType"><option>ÖNEMLİ</option><option>TEKRAR ET</option><option>SINAV</option><option>DOĞRU ✔</option><option>YANLIŞ ✘</option><option>GİZLİ</option><option>ŞÜPHELİ</option></select>
  </div>
  <input type="color" id="color" value="#c1121f" title="İp ve kalem rengi">
  <label class="rng" title="Kalem kalınlığı">Kalınlık <input type="range" id="size" min="1" max="12" value="3"></label>
  <div class="grp">
    <button id="addPolaroid">+ Fotoğraf</button>
    <button id="addNews">+ Kupür</button>
    <button id="addNote">+ Not</button>
    <button id="addDoc">+ Kâğıt</button>
    <button id="addTl">+ Zaman çizelgesi</button>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="grp">
    <input id="cat" list="cats" placeholder="Etiket yaz…" size="11" title="Seçili kartın etiketi: istediğini yaz" disabled><datalist id="cats"><option value="Önemli"><option value="Fikir"><option value="Soru"><option value="Örnek"><option value="Tarih"><option value="Diğer"></datalist><input type="color" id="catColor" title="Etiket rengi" disabled>
    <button id="smaller" title="Küçült (-)">−</button><button id="bigger" title="Büyüt (+)">+</button>
    <label class="rng" title="Seçili kartın açısı (serbest)">Açı <input type="range" id="rot" min="-180" max="180" value="0" disabled></label><button id="rot0" title="Açıyı sıfırla">↺</button>
    <label class="rng" title="Seçili fotoğrafın parlaklığı">Parlaklık <input type="range" id="bright" min="30" max="200" value="100" disabled></label>
    <button id="lensBtn">Büyüteç</button>
    <button id="del">Seçileni sil</button>
    <button id="clear">Çizimi sil</button>
    <button id="saveJson">Kaydet</button><button id="openJson">Aç</button><input type="file" id="jsonFile" accept=".json" hidden>
  </div>
  <div class="grp">
    <select id="fmt"><option value="png1">PNG 1x</option><option value="png2" selected>PNG 2x</option><option value="png3">PNG 3x</option><option value="A4">A4 PDF</option><option value="A3">A3 PDF</option><option value="POSTER">Poster PDF</option></select>
    <select id="split" title="Panoyu kaç sayfaya böl"><option value="1">1 sayfa</option><option value="2">4 sayfaya böl (2×2)</option><option value="3">9 sayfaya böl (3×3)</option></select>
    <label class="rng" title="Boş kenarları kırp, sayfayı doldur"><input type="checkbox" id="fit" checked> Dolu alana sığdır</label>
    <button id="png" class="main">İndir</button>
  </div>
</div>
<div id="legend"></div>
<div id="lens" hidden><div id="lw"></div></div>
<p id="hint">Tekerlek: yakınlaştır · Boş alanı sürükle: gezin · Kartı seç: sarı nokta boyut, üstteki ↻ noktası serbest açı (Shift: 15° adım) · İpe tıkla: etiket, Shift+tık: sil · Çift tıkla: mührü sil · Etiketin üstüne tıklayıp yazarak adını değiştirebilirsin · Pano otomatik kaydedilir</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
