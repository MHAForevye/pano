# Cloudflare Workers: hem siteyi (statik dosyalar) hem /api/* kristal sunucusunu çalıştırır.
name = "mikroklima"
main = "worker/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "."                     # siteyi bu klasörden sunar (gizlenecekler .assetsignore'da)
run_worker_first = ["/api/*"]       # sadece /api/* Worker'a gider, gerisi statik dosya

[[d1_databases]]
binding = "DB"
database_name = "mikroklima"
database_id = "a4576ecf-eead-4f1a-9cbf-ae0f6f79ccc6"   # npx wrangler d1 create mikroklima  çıktısındaki id

# Gizli değer (dosyaya yazma!):  npx wrangler secret put ADMIN_TOKEN
